<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/karyasetu-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaryaSetu | Cooperative-Owned Digital Services Marketplace</title>
    <!-- Modern Sans Typography: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Official Google Maps API Script -->
    <script>
      (function() {
        const storedKey = localStorage.getItem('KARYASETU_GOOGLE_MAPS_API_KEY') || '';
        const script = document.createElement('script');
        script.id = 'google-maps-js-api';
        script.async = true;
        script.defer = true;
        const keyQuery = storedKey ? `&key=${encodeURIComponent(storedKey)}` : '';
        script.src = `https://maps.googleapis.com/maps/api/js?libraries=places,geometry,marker${keyQuery}`;
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased min-h-screen selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
